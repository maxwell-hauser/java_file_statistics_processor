name: Java CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Compile Java source
      run: javac FileStatisticsProcessor.java

    - name: Package JAR
      run: jar --create --file java-file-statistics-processor.jar --main-class FileStatisticsProcessor FileStatisticsProcessor.class 'FileStatisticsProcessor$*.class'

    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: java-file-statistics-processor
        path: java-file-statistics-processor.jar
